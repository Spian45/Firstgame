<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>United Realm: Spirit of the Twilight Vale</title>
    <meta name="author" content="Spian45, Charlotte_B">
    <!-- installable app (phones: INSTALL APP on the title menu, or the browser's install option) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0b0710">
    <link rel="icon" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0b0710;
            overflow: hidden;
            /* touch screens: no scrolling, zooming, text selection or tap highlight over the game */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* touch controls overlay (src/touch.js): sized in screen pixels, laid over the whole window */
        #touch-ui {
            position: fixed;
            inset: 0;
            display: none;
            pointer-events: none;
            z-index: 5;
            font-family: "Courier New", monospace;
            font-weight: bold;
        }
        .touch-btn {
            position: absolute;
            box-sizing: border-box;
            border-radius: 50%;
            border: 3px solid rgba(242, 235, 224, 0.55);
            background: rgba(20, 12, 28, 0.55);
            color: rgba(242, 235, 224, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35);
        }
        .touch-btn.on {
            border-color: #f0b84a;
            background: rgba(74, 47, 60, 0.85);
            color: #f0b84a;
            transform: scale(0.94);
        }
        .touch-pause {
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
        }
        .touch-stick {
            position: absolute;
            display: none;
            box-sizing: border-box;
            border-radius: 50%;
            border: 3px solid rgba(242, 235, 224, 0.35);
            background: rgba(20, 12, 28, 0.35);
        }
        .touch-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
            border-radius: 50%;
            background: rgba(240, 184, 74, 0.75);
            border: 3px solid rgba(255, 242, 192, 0.8);
            box-sizing: border-box;
        }
        .touch-hint {
            position: absolute;
            left: calc(24px + env(safe-area-inset-left));
            bottom: calc(28px + env(safe-area-inset-bottom));
            padding: 10px 16px;
            border-radius: 24px;
            border: 2px dashed rgba(242, 235, 224, 0.3);
            color: rgba(242, 235, 224, 0.45);
            font-size: 14px;
        }
        #game {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #140c1c;
        }
    </style>
</head>
<body>
    <canvas id="game" width="640" height="360"></canvas>
    <script type="module" src="src/main.js"></script>
    <script>
        // offline cache for the installed app (only on https / localhost)
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
        // Chrome offers installing the app: keep the offer for the title menu's INSTALL APP option
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.installPrompt = e;
        });
        window.addEventListener('appinstalled', () => { window.installPrompt = null; });
    </script>
</body>
</html>
